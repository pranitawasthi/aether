[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = {
    version = "1",
    features = ["v4", "serde"]
}

chrono = {
    version = "0.4",
    features = ["serde"]
}

tracing = "0.1"

tracing-subscriber = "0.3"

thiserror = "2"

async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
